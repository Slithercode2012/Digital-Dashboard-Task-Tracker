<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Dashboard - Merged Calendar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>

    <style>
        :root {
            --bg-color: #06070d;
            --panel-bg: rgba(13, 15, 28, 0.7);
            --text-main: #f0f3fa;
            --text-sub: #7a8299;
            --border-glow: rgba(108, 92, 231, 0.15);
            --border-bright: rgba(108, 92, 231, 0.4);
            --high: #ff3838;
            --medium: #ff9f43;
            --low: #10ac84;
            --high-bg: rgba(255, 56, 56, 0.06);
            --medium-bg: rgba(255, 159, 67, 0.06);
            --low-bg: rgba(16, 172, 132, 0.06);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 172, 132, 0.04) 0px, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: auto, auto, 24px 24px, 24px 24px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            width: 100%;
            max-width: 1350px;
        }

        #clock {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #a8a5ff 0%, #54a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        #greeting {
            font-size: 1.1rem;
            margin-top: 8px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-actions {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 10px;
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glow);
            padding: 12px 18px;
            font-size: 13px;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            border-color: var(--border-bright);
            background: rgba(255, 255, 255, 0.07);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1350px;
        }

        @media (min-width: 1150px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1.1fr;
            }
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 700;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 26px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"] { flex-grow: 1; }
        input[type="date"] { color-scheme: dark; }

        button.action-btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #a8a5ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        #calendar {
