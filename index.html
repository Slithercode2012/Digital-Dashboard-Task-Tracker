<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shared Dashboard</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e4e4e7;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #2d2d34;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            width: 100%;
            max-width: 1100px;
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        #greeting {
            font-size: 1.5rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        .settings-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #27272a;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
