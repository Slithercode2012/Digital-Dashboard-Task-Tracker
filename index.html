<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Priority Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="header">
        <div id="clock">00:00:00</div>
        <div id="greeting">Hello!</div>
        <button class="settings-btn" onclick="toggleModal(true)">⚙️ Calendar Setup</button>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>Priority Board</h2>
            <div class="input-stack">
                <input type="text" id="taskInput" placeholder="What needs to be done?">
                <div class="input-row">
                    <input type="date" id="dateInput">
                    <select id="priorityInput">
                        <option value="high">🔥 High</option>
                        <option value="medium" selected>⚡ Medium</option>
                        <option value="low">🌱 Low</option>
                    </select>
                    <button onclick="addTask()">Add</button>
                </div>
            </div>

            <div class="kanban-board">
                <div class="kanban-column" id="high" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
                    <div class="column-header col-high">High</div>
                </div>
                <div class="kanban-column" id="medium" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
                    <div class="column-header col-medium">Medium</div>
                </div>
                <div class="kanban-column" id="low" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
                    <div class="column-header col-low">Low</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Shared Calendar</h2>
            <div class="calendar-container">
                <iframe id="calendarFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0; color: #fff;">Configure Shared Calendar</h3>
            <p style="font-size: 14px; color: #a1a1aa; margin: 0;">Paste your Google Calendar embed link below:</p>
            <input type="text" id="calUrlInput" placeholder="https://calendar.google.com/calendar/embed?src=...">
            <div class="input-row" style="justify-content: flex-end;">
                <button onclick="toggleModal(false)" style="background-color: #27272a;">Cancel</button>
                <button onclick="saveCalendarLink()">Save & Reload</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
