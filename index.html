<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Productivity Dashboard</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e4e4e7;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #2d2d34;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        #greeting {
            font-size: 1.5rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #fff;
        }

        /* To-Do List Styles */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, textarea {
            background-color: #27272a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        input[type="text"] {
            flex-grow: 1;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #212124;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .delete-btn {
            background-color: #ef4444;
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        /* Quick Notes Styles */
        textarea {
            width: 100%;
            height: 150px;
            resize: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="clock">00:00:00</div>
        <div id="greeting">Hello!</div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>Daily Tasks</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="taskList"></ul>
        </div>

        <div class="card">
            <h2>Scratchpad / Notes</h2>
            <textarea id="noteArea" placeholder="Type notes here... they will save automatically!"></textarea>
        </div>
    </div>

    <script>
        // 1. Clock and Greeting Logic
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;
            
            document.getElementById('clock').textContent = timeString;

            // Update Greeting based on hours (0-23)
            const currentHour = now.getHours();
            let greetingText = "Good evening";
            if (currentHour < 12) {
                greetingText = "Good morning";
            } else if (currentHour < 18) {
                greetingText = "Good afternoon";
            }
            document.getElementById('greeting').textContent = greetingText + ", welcome back!";
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. To-Do List Logic with LocalStorage
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        let savedTasks = JSON.parse(localStorage.getItem('dashboardTasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            savedTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${task}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">Done</button>
                `;
                taskList.appendChild(li);
            });
            localStorage.setItem('dashboardTasks', JSON.stringify(savedTasks));
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText !== '') {
                savedTasks.push(taskText);
                taskInput.value = '';
                renderTasks();
            }
        }

        function deleteTask(index) {
            savedTasks.splice(index, 1);
            renderTasks();
        }

        // Allow pressing Enter key to add task
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // 3. Notepad Logic with LocalStorage
        const noteArea = document.getElementById('noteArea');
        noteArea.value = localStorage.getItem('dashboardNotes') || '';

        noteArea.addEventListener('input', () => {
            localStorage.setItem('dashboardNotes', noteArea.value);
        });

        // Initial Load
        renderTasks();
    </script>
</body>
</html>
