<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Dashboard & Task Tracker</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e4e4e7;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #2d2d34;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        #greeting {
            font-size: 1.5rem;
            margin: 5px 0 0 0;
            color: #a1a1aa;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .calendar-card {
            grid-column: span 1;
        }

        @media (min-width: 850px) {
            .calendar-card {
                grid-column: span 2;
            }
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #fff;
        }

        /* Form Layout */
        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input, textarea {
            background-color: #27272a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        input[type="text"] {
            flex-grow: 1;
        }

        input[type="date"] {
            color-scheme: dark; /* Makes the calendar picker match dark mode */
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            max-height: 250px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #212124;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-date {
            font-size: 0.8rem;
            color: #a1a1aa;
        }

        .delete-btn {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        /* Calendar Responsive Wrapper */
        .calendar-container {
            position: relative;
            padding-bottom: 60%; /* Aspect ratio */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .calendar-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="clock">00:0
