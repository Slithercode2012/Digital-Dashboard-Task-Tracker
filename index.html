<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Dashboard - Native Grid</title>
    <style>
        :root {
            --bg-color: #06070d;
            --panel-bg: rgba(13, 15, 28, 0.7);
            --text-main: #f0f3fa;
            --text-sub: #7a8299;
            --border-glow: rgba(108, 92, 231, 0.15);
            --border-bright: rgba(108, 92, 231, 0.4);
            --high: #ff3838;
            --medium: #ff9f43;
            --low: #10ac84;
            --high-bg: rgba(255, 56, 56, 0.06);
            --medium-bg: rgba(255, 159, 67, 0.06);
            --low-bg: rgba(16, 172, 132, 0.06);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 172, 132, 0.04) 0px, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: auto, auto, 24px 24px, 24px 24px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1350px;
        }

        #clock {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #a8a5ff 0%, #54a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        #greeting {
            font-size: 1.1rem;
            margin-top: 8px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1350px;
        }

        @media (min-width: 1150px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1.1fr;
            }
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 700;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 26px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"] { flex-grow: 1; }
        input[type="date"] { color-scheme: dark; }

        button.action-btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #a8a5ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Pure CSS Native Calendar Layout */
        .native-cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .cal-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .native-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .weekday-label {
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding-bottom: 8px;
        }
        .cal-day {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            min-height: 70px;
            padding: 6px;
            text-align: right;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .cal-day.today {
            border-color: var(--border-bright);
            background: rgba(108, 92, 231, 0.05);
        }
        .cal-day.empty {
            background: transparent;
            border: none;
        }
        .day-number {
            font-weight: 600;
            color: var(--text-main);
        }
        .day-events {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 5px;
            text-align: left;
        }
        .native-event-badge {
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: var(--medium-bg);
            border-left: 2px solid var(--medium);
            color: #fff;
        }

        /* Kanban Layout */
        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .kanban-column { background-color: rgba(0, 0, 0, 0.2); border: 1px dashed rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 14px; min-height: 380px; display: flex; flex-direction: column; gap: 12px; }
        .column-header { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; text-align: center; }
        .col-high { color: var(--high); } .col-medium { color: var(--medium); } .col-low { color: var(--low); }
        .task-item { border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
        .task-item.high { background: var(--high-bg); border-left: 3px solid var(--high); }
        .task-item.medium { background: var(--medium-bg); border-left: 3px solid var(--medium); }
        .task-item.low { background: var(--low-bg); border-left: 3px solid var(--low); }
        .delete-btn { background: transparent; color: var(--text-sub); border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div id="clock">00:00:00</div>
        <div id="greeting">LOCAL DESKTOP SYSTEM</div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>Priority Board</h2>
            <div class="input-stack">
                <input type="text" id="taskInput" placeholder="What needs to be done?">
                <div class="input-row">
                    <input type="date" id="dateInput">
                    <select id="priorityInput">
                        <option value="high">🔥 High Priority</option>
                        <option value="medium" selected>⚡ Medium Priority</option>
                        <option value="low">🌱 Low Priority</option>
                    </select>
                    <button class="action-btn" onclick="addTask()">Add Task</button>
                </div>
            </div>
